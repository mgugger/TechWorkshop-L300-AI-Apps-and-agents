name: techworkshop-l300-ai-agents
infra:
  provider: bicep
  path: src/infra
  module: DeployAzureResources
services:
  chat-app:
    project: ./src
    host: containerapp
    language: python
    docker:
      path: ./Dockerfile
      context: .
hooks:
  postprovision:
    shell: sh
    run: cd ./src && uv run python scripts/setup_solution.py
